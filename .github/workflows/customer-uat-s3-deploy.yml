name: Customer UAT S3 Deploy

on:
  push:
    branches:
      - uat
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-uat-deploy
  cancel-in-progress: true

jobs:
  deploy-customer-uat:
    name: Build and deploy customer to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same static build is served by both distributions. Branding is
      # selected in the browser from the requested hostname.
      - name: Build customer app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync versioned static assets to S3
        run: |
          aws s3 sync dist/ "s3://${{ secrets.CUSTOMER_S3_BUCKET }}/" \
            --delete \
            --exclude "index.html"

      - name: Upload index.html with no-cache policy
        run: |
          aws s3 cp dist/index.html "s3://${{ secrets.CUSTOMER_S3_BUCKET }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate PetVetConnect CloudFront distribution
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CUSTOMER_CLOUDFRONT_DISTRIBUTION_ID_PETVETCONNECT }}" \
            --paths "/*"

      - name: Invalidate VetLlama CloudFront distribution
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CUSTOMER_CLOUDFRONT_DISTRIBUTION_ID_VETLLAMA }}" \
            --paths "/*"
