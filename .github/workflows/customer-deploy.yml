name: Customer Deploy

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: customer-deploy-staging
  cancel-in-progress: true

env:
  DEPLOY_BASE_PATH: /var/www/vetllama-frontend-projects
  TEMP_BASE_PATH: /home/ubuntu/frontend-deploy-temp
  APP_NAME: customer

jobs:
  deploy:
    name: Deploy customer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build customer app
        run: npm run build

      - name: Prepare temp and live folders on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            TEMP_PATH="${{ env.TEMP_BASE_PATH }}/${{ env.APP_NAME }}"
            LIVE_PATH="${{ env.DEPLOY_BASE_PATH }}/${{ env.APP_NAME }}"

            mkdir -p "$TEMP_PATH"
            rm -rf "$TEMP_PATH"/*
            sudo mkdir -p "$LIVE_PATH/dist"
            sudo chown -R $USER:$USER "$LIVE_PATH"

      - name: Upload new build to temp folder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: dist/*
          target: ${{ env.TEMP_BASE_PATH }}/${{ env.APP_NAME }}
          strip_components: 1
          overwrite: true

      - name: Publish build to live folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            TEMP_PATH="${{ env.TEMP_BASE_PATH }}/${{ env.APP_NAME }}"
            LIVE_PATH="${{ env.DEPLOY_BASE_PATH }}/${{ env.APP_NAME }}"

            rm -rf "$LIVE_PATH/dist"/*
            cp -r "$TEMP_PATH"/* "$LIVE_PATH/dist/"
            find "$LIVE_PATH" -type d -exec chmod 755 {} \;
            find "$LIVE_PATH" -type f -exec chmod 644 {} \;
            sudo systemctl reload nginx
